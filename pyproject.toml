# NOTE only Cython is needed to build: no Cython module cimports numpy or
#      composites. Every package listed here must also be resolved when
#      cross-compiling to WebAssembly, see .github/workflows/pyodide.yml
[build-system]
requires = [
    "setuptools>=77",
    "cython",
    "tomli; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "panels"
version = "0.14.2"
description = "Semi-analytical models for plates, shells and stiffened panels"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Saullo G. P. Castro", email = "S.G.P.Castro@tudelft.nl" },
    { name = "Nathan D'Souza" },
]
keywords = [
    "Ritz method", "semi-analytical", "Energy-based method",
    "structural analysis", "structural optimization", "static analysis",
    "buckling", "vibration", "panel flutter", "structural dynamics",
    "implicit time integration", "explicit time integration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: POSIX :: BSD",
    "Environment :: WebAssembly :: Emscripten",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "composites>=0.10.2",
    "structsolve>=0.9.3",
]

[project.urls]
Homepage = "https://github.com/saullocastro/panels"
Documentation = "https://saullocastro.github.io/panels/"
Repository = "https://github.com/saullocastro/panels"

[tool.setuptools.packages.find]
include = ["panels*"]

[tool.setuptools.package-data]
panels = [
    "*.py", "*.pxd", "*.pyx",
    "core/include/*.hpp",
    "core/src/*.cpp",
    "models/*.pyx", "models/*.pxd",
]
