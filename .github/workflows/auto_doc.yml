name: Documentation

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc
        python3 -m pip install --upgrade pip
        # NOTE structsolve>=0.13.0 from its pull request branch, reverted
        #      once structsolve 0.13.0 is on PyPI
        python3 -m pip install "structsolve @ git+https://github.com/saullocastro/structsolve@perf-linear-solvers"
        python3 -m pip install --upgrade -r requirements.txt
        python3 -m pip install --upgrade -r requirements_doc.txt
    - name: Install module
      run: |
        python3 -m pip install . 
    - name: Building documentation
      run: |
        cd doc
        make html
    - name: Deploying documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: ./doc/build/html # The folder the action should deploy.
